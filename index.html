    <style>
      html, body { margin: 0; padding: 0; background: #050818; color: #FFF8E7; overflow-x: hidden; }
      body { font-family: 'Inter', system-ui, sans-serif; }
      #root { min-height: 100vh; }

      /* Instant loading screen (no JS needed) */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #101635 0%, #050818 70%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #initial-loader.hidden { opacity: 0; pointer-events: none; }

      .loader-content { text-align: center; }
      .loader-dot {
        width: 8px;
        height: 8px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: #FFC145;
        box-shadow: 0 0 20px 2px rgba(255, 193, 69, 0.4);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.8); opacity: 0.6; }
        50% { transform: scale(1.2); opacity: 1; }
      }
      .loader-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #FFF8E7;
      }
      .loader-subtext {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: rgba(255, 248, 231, 0.4);
        margin-top: 12px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-content">
        <div class="loader-dot"></div>
        <div class="loader-text">Michael Oluseye</div>
        <div class="loader-subtext">SYS // INITIALIZING</div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
